name: Deploy to Vercel

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Build application
        run: npm run build
        env:
          NODE_OPTIONS: --max-old-space-size=4096

      - name: Deploy to Vercel (Production)
        if: (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master') && secrets.VERCEL_TOKEN != ''
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-args: '--prod'
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Deploy to Vercel (Preview)
        if: (github.ref != 'refs/heads/main' && github.ref != 'refs/heads/master') && secrets.VERCEL_TOKEN != ''
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-args: '--no-wait'
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Build Success Notification
        if: success()
        run: |
          echo "✅ Build completed successfully!"
          echo "📦 Application built and ready for deployment"
          if [ "${{ secrets.VERCEL_TOKEN }}" = "" ]; then
            echo "ℹ️  Vercel deployment skipped - VERCEL_TOKEN not configured"
            echo "To enable Vercel deployment, add VERCEL_TOKEN, VERCEL_ORG_ID, and VERCEL_PROJECT_ID secrets"
          fi

      - name: Comment PR with build status
        if: github.event_name == 'pull_request' && success()
        uses: actions/github-script@v7
        with:
          script: |
            const hasVercelSecrets = '${{ secrets.VERCEL_TOKEN }}' !== '';
            let body = '✅ **Build completed successfully!**\n\n📦 Application built and ready for deployment.';

            if (hasVercelSecrets) {
              // Try to get deployment info if Vercel secrets are configured
              try {
                const { data: deployments } = await github.rest.repos.listDeployments({
                  owner: context.repo.owner,
                  repo: context.repo.repo
                });
                const latestDeployment = deployments[0];
                if (latestDeployment) {
                  const deploymentUrl = `https://${latestDeployment.environment}.vercel.app`;
                  body += `\n\n🚀 **Preview Deployment:** ${deploymentUrl}`;
                }
              } catch (error) {
                console.log('Could not fetch deployment info:', error.message);
              }
            } else {
              body += '\n\nℹ️ Vercel deployment is not configured. To enable automatic deployments, add `VERCEL_TOKEN`, `VERCEL_ORG_ID`, and `VERCEL_PROJECT_ID` secrets to this repository.';
            }

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: body
            });
